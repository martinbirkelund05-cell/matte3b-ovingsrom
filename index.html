<title>Studieplattform · Matte 3B, Mekanikk 1, Elementmetoden</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Lys, minimalistisk layout i Capquiz/Moodle-ånd: topplinje, venstremeny på brede skjermer, innhold i kort. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --line:#dfe3e8; --fg:#1d2125; --muted:#5f6b76;
  --accent:#0f6cbf; --accent-soft:#e6f0fa; --accent-fg:#ffffff;
  --good:#2e7d32; --good-soft:#e7f3e8; --warn:#9a6a00; --warn-soft:#fbf3dc; --bad:#c62828; --bad-soft:#fbe9e9; --grey-soft:#eceff2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#15181c;--surface:#1e2228;--line:#333a43;--fg:#e8eaed;--muted:#9aa4af;--accent:#5aa5e8;--accent-soft:#1e2f42;--accent-fg:#0b1a2a;--good:#7cc47f;--good-soft:#1f3322;--warn:#e0b45c;--warn-soft:#3a3118;--bad:#ef8a8a;--bad-soft:#3d2222;--grey-soft:#272c33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181c;--surface:#1e2228;--line:#333a43;--fg:#e8eaed;--muted:#9aa4af;--accent:#5aa5e8;--accent-soft:#1e2f42;--accent-fg:#0b1a2a;--good:#7cc47f;--good-soft:#1f3322;--warn:#e0b45c;--warn-soft:#3a3118;--bad:#ef8a8a;--bad-soft:#3d2222;--grey-soft:#272c33;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
button{font:inherit}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-weight:600;letter-spacing:.01em;text-decoration:none;color:var(--fg);display:flex;align-items:center;gap:10px}
.brand .mark{width:26px;height:26px;border-radius:6px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-family:var(--mono);font-size:12px;font-weight:500}
.topbar nav{display:flex;gap:4px;flex-wrap:wrap}
#filebar .fn{font-size:12px;color:var(--muted);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#filebar .fn.dirty{color:var(--warn);font-weight:500}
@media(max-width:700px){#filebar .fn{display:none}}
.topbar nav a{text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:6px;font-size:14px}
.topbar nav a.active,.topbar nav a:hover{color:var(--fg);background:var(--accent-soft)}
.wrap{max-width:1840px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:1fr;gap:20px}
@media(min-width:900px){.wrap{grid-template-columns:200px minmax(0,1fr)}}
@media(min-width:1300px){.wrap{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));gap:28px}}
.side{display:none}
@media(min-width:900px){.side{display:block;position:sticky;top:calc(58px + env(safe-area-inset-top,0px));align-self:start}}
.side a{display:block;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:6px;font-size:14px}
.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.side .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.side .sub a{padding-left:22px;font-size:13px;color:var(--muted)}
.side .sub a.active{color:var(--accent)}
main{min-width:0}
h1{font-size:24px;font-weight:600;margin:0 0 4px;text-wrap:balance}
h2{font-size:18px;font-weight:600;margin:0 0 10px;text-wrap:balance}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
.lead{color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:var(--bg)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .n{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--muted);font-size:13px;margin-top:4px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:500}
.btn.small{padding:4px 10px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.mute{background:var(--grey-soft);color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl td.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto}
/* stolper */
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:minmax(120px,1.3fr) minmax(0,2fr) 48px;gap:10px;align-items:center;font-size:13px}
.bar .lab{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .trk{display:grid;gap:3px}
.bar .trk b{display:block;height:6px;background:var(--bg);border:1px solid var(--line);border-radius:4px;position:relative;overflow:hidden}
.bar .trk i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:3px}
.bar .trk i.w{background:var(--muted);opacity:.45}
.bar .v{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--accent)}
.legend span.w::before{background:var(--muted);opacity:.35}
.prog{height:8px;background:var(--grey-soft);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.prog.good i{background:var(--good)}.prog.warn i{background:var(--warn)}
/* oppgave */
.qtext{font-size:15.5px;line-height:1.65;max-width:76ch}
.qtext p{margin:0 0 10px}
.qtext pre{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;margin:6px 0 12px}
.qtext mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%}
.fig{display:inline-block;font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:4px;padding:1px 8px;margin:2px 0}
.fld{display:inline-flex;align-items:center;gap:6px;vertical-align:middle;margin:2px 0;flex-wrap:wrap}
.fld .tag{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--grey-soft);border-radius:4px;padding:1px 5px}
.fld input[type=text]{font-family:var(--mono);font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg);min-width:150px;width:min(100%,260px)}
.fld select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--fg)}
.fld.ok input,.fld.ok select{border-color:var(--good);background:var(--good-soft)}
.fld.bad input,.fld.bad select{border-color:var(--bad);background:var(--bad-soft)}
.fld.seen input,.fld.seen select{border-color:var(--warn);background:var(--warn-soft)}
.fld .st{font-size:12px;font-weight:500;color:var(--muted)}
.fld.ok .st{color:var(--good)}.fld.bad .st{color:var(--bad)}.fld.seen .st{color:var(--warn)}
textarea.code{width:100%;min-height:160px;font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--surface);color:var(--fg);box-sizing:border-box}
/* hjelpepanel under hver deloppgave */
.help{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 6px 6px 0;background:var(--bg);padding:8px 12px;margin:4px 0 14px;max-width:76ch}
.help .hd{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:13px}
.help .hd .lab{font-weight:600;color:var(--muted);margin-right:4px}
.help .body{margin-top:8px;display:grid;gap:8px}
.hintbox{border-left:3px solid var(--accent);background:var(--accent-soft);padding:8px 12px;border-radius:0 6px 6px 0}
.hintbox .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600}
.fasit{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:var(--surface)}
.fasit h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fasit code,.mono{font-family:var(--mono);font-size:13px;background:var(--bg);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.sitat{border-left:3px solid var(--muted);padding:6px 12px;color:var(--muted);font-style:italic;margin:8px 0}
.ref{font-size:13px;color:var(--muted)}
.warnnote{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:6px 10px}

/* ===== Capquiz/Moodle-layout inne i øving og prøve ===== */
.cq{--cq-info:#f8f9fa;--cq-line:#dee2e6;--cq-form:#e7f3f5;--cq-form-fg:#001a1e;--cq-out:#fcefdc;--cq-out-fg:#7d5a29;--cq-ok:#357a32;--cq-ok-bg:#d7e4d6;--cq-ok-fg:#1c3f1a;--cq-bad:#ca3120;--cq-bad-bg:#f4d6d2;--cq-bad-fg:#691911;--cq-part:#f0ad4e;--cq-part-bg:#fcefdc;--cq-part-fg:#7d5a29;--cq-sec:#ced4da;--cq-sec-h:#b8c1ca;--cq-sec-fg:#1d2125;--cq-prim:#0f6cbf;--cq-prim-h:#0c589c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cq{--cq-info:#22272e;--cq-line:#3a424c;--cq-form:#1b2f36;--cq-form-fg:#e3eef0;--cq-out:#3a3118;--cq-out-fg:#ecd9a8;--cq-ok:#6fbf73;--cq-ok-bg:#1f3322;--cq-ok-fg:#cfe8d0;--cq-bad:#ef8a8a;--cq-bad-bg:#3d2222;--cq-bad-fg:#f6d3d3;--cq-part:#e0b45c;--cq-part-bg:#3a3118;--cq-part-fg:#ecd9a8;--cq-sec:#4a535e;--cq-sec-h:#5a6470;--cq-sec-fg:#e8eaed;--cq-prim:#5aa5e8;--cq-prim-h:#7bb8ee}}
:root[data-theme="dark"] .cq{--cq-info:#22272e;--cq-line:#3a424c;--cq-form:#1b2f36;--cq-form-fg:#e3eef0;--cq-out:#3a3118;--cq-out-fg:#ecd9a8;--cq-ok:#6fbf73;--cq-ok-bg:#1f3322;--cq-ok-fg:#cfe8d0;--cq-bad:#ef8a8a;--cq-bad-bg:#3d2222;--cq-bad-fg:#f6d3d3;--cq-part:#e0b45c;--cq-part-bg:#3a3118;--cq-part-fg:#ecd9a8;--cq-sec:#4a535e;--cq-sec-h:#5a6470;--cq-sec-fg:#e8eaed;--cq-prim:#5aa5e8;--cq-prim-h:#7bb8ee}
.cq{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:1100px){.cq{grid-template-columns:minmax(0,1fr) 230px;align-items:start}}
.cq-main{min-width:0;display:grid;gap:16px}
.cq-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
/* spørsmålsblokk: infoboks til venstre, blå oppgaveboks til høyre */
.que{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
@media(min-width:700px){.que{grid-template-columns:8.2em minmax(0,1fr);gap:12px}}
.que .info{background:var(--cq-info);border:1px solid var(--cq-line);border-radius:4px;padding:8px 10px;font-size:12.5px;line-height:1.45;align-self:start;color:var(--fg)}
.que .info h3{font-size:12.5px;font-weight:400;margin:0 0 4px}
.que .info h3 .qno{font-size:20px;font-weight:700}
.que .info .state{font-weight:600}
.que .info .state.ok{color:var(--cq-ok)}.que .info .state.bad{color:var(--cq-bad)}.que .info .state.part,.que .info .state.seen{color:var(--cq-part-fg)}
.que .info .grade{color:var(--muted);margin-top:2px}
.que .info .meta{margin-top:6px;padding-top:6px;border-top:1px solid var(--cq-line);color:var(--muted);font-size:11.5px}
.que .content{min-width:0;display:grid;gap:8px;grid-template-columns:minmax(0,1fr)}
.que .formulation{background:var(--cq-form);color:var(--cq-form-fg);border-radius:4px;padding:12px 16px;min-width:0;overflow-wrap:anywhere}
.que .formulation .qtext pre{white-space:pre;overflow-x:auto;max-width:100%}
.que .formulation mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.cq .fld{max-width:100%}.cq .fld input[type=text]{min-width:0;width:280px;max-width:100%;flex:0 1 280px}
.que .formulation .qtitle{font-weight:600;margin:0 0 8px}
.que .formulation .qtext{max-width:none;font-size:15px;line-height:1.6}
.que .formulation .qtext pre{background:var(--surface);color:var(--fg)}
.que .formulation .fig{background:var(--surface)}
.que .formulation a{color:var(--cq-prim)}
/* lilla merking av Python-oppgaver */
.pybox{display:flex;gap:10px;align-items:flex-start;background:#ece6f8;color:#3d2470;border:1px solid #c9b8ea;border-left:4px solid #6f42c1;border-radius:4px;padding:8px 12px;margin:0 0 10px;font-size:14px;line-height:1.45}
.pybox .py-ic{flex:none;background:#6f42c1;color:#fff;font-family:var(--mono);font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px;margin-top:1px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pybox{background:#2c2244;color:#e2d8f7;border-color:#5a4590;border-left-color:#a98be6}:root:not([data-theme="light"]) .pybox .py-ic{background:#a98be6;color:#1c1430}}
:root[data-theme="dark"] .pybox{background:#2c2244;color:#e2d8f7;border-color:#5a4590;border-left-color:#a98be6}:root[data-theme="dark"] .pybox .py-ic{background:#a98be6;color:#1c1430}
.pybox.paper{background:var(--cq-info);color:var(--fg);border-color:var(--cq-line);border-left-color:#8f959e}.pybox.paper .py-ic{background:#8f959e;color:#fff}
/* celler og knapper som i Moodle */
.cq .fld input[type=text],.cq .fld select{border:1px solid #8f959e;border-radius:.5rem;background:var(--surface);color:var(--fg);padding:6px 10px}
.cq .fld .tag{background:var(--surface);border:1px solid var(--cq-line)}
.cq .fld.ok input,.cq .fld.ok select{border-color:var(--cq-ok);background:var(--surface);box-shadow:0 0 0 1px var(--cq-ok)}
.cq .fld.bad input,.cq .fld.bad select{border-color:var(--cq-bad);background:var(--surface);box-shadow:0 0 0 1px var(--cq-bad)}
.cq .fld.seen input,.cq .fld.seen select{border-color:var(--cq-part);background:var(--surface);box-shadow:0 0 0 1px var(--cq-part)}
.cq .fld .st{font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px}
.cq .fld .st:empty{display:none}
.cq .fld.ok .st{background:var(--cq-ok-bg);color:var(--cq-ok-fg)}.cq .fld.ok .st::before{content:"✓ "}
.cq .fld.bad .st{background:var(--cq-bad-bg);color:var(--cq-bad-fg)}.cq .fld.bad .st::before{content:"✗ "}
.cq .fld.seen .st{background:var(--cq-part-bg);color:var(--cq-part-fg)}
.cq .btn{border-radius:.5rem}
.cq .btn.sec,.cq button.chk{background:var(--cq-sec);border-color:var(--cq-sec);color:var(--cq-sec-fg)}
.cq .btn.sec:hover,.cq button.chk:hover{background:var(--cq-sec-h);border-color:var(--cq-sec-h)}
.cq .btn.primary{background:var(--cq-prim);border-color:var(--cq-prim)}
.cq .btn.primary:hover{background:var(--cq-prim-h);border-color:var(--cq-prim-h)}
.cq textarea.code{border:1px solid #8f959e;border-radius:.5rem}
/* nedtrekk under hvert felt */
.cq .help{border:0;background:transparent;padding:0;margin:6px 0 14px;max-width:none}
.cq .help .hd{gap:6px}
.cq .help .hd .lab{font-size:12px;color:var(--cq-form-fg);opacity:.75}
.dd{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--cq-sec);background:var(--surface);color:var(--fg);border-radius:.5rem;padding:4px 10px;font-size:13px;cursor:pointer}
.dd::after{content:"▾";font-size:11px;color:var(--muted);transition:transform .15s}
.dd[aria-expanded="true"]{background:var(--cq-sec);border-color:var(--cq-sec);color:var(--cq-sec-fg)}
.dd[aria-expanded="true"]::after{transform:rotate(180deg);color:inherit}
.dd:hover{border-color:var(--cq-prim)}
.cq .help .body{margin-top:8px;gap:8px}
.ddp{border-radius:4px;padding:10px 14px;position:relative}
.ddp .ddx{position:absolute;top:6px;right:8px;border:0;background:transparent;color:inherit;opacity:.7;cursor:pointer;font-size:12px;padding:2px 6px;border-radius:4px}
.ddp .ddx:hover{opacity:1;background:rgba(0,0,0,.08)}
.ddp h4{margin:0 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.ddp.hints,.ddp.komp{background:var(--surface);border:1px solid var(--cq-line);color:var(--fg)}
.ddp.fas{background:var(--cq-out);color:var(--cq-out-fg)}
.ddp.fas .steps li{color:var(--fg)}
.ddp.fas .rightanswer{font-size:15px;margin:0 0 10px}
.ddp.fas code{font-family:var(--mono);background:var(--surface);color:var(--fg);border:1px solid var(--cq-line);padding:2px 6px;border-radius:4px}
.ddp .warnnote{margin-right:64px!important;background:var(--surface);color:var(--cq-part-fg);border:1px solid var(--cq-part)}
/* navigasjon i quizen */
.qnav-block{background:var(--surface);border:1px solid var(--cq-line);border-radius:8px;padding:14px}
@media(min-width:1100px){.qnav-block{position:sticky;top:calc(64px + env(safe-area-inset-top,0px))}}
.qnav-block h3{font-size:15px;margin:0 0 10px}
.qn-buttons{display:flex;flex-wrap:wrap;gap:6px}
.qnbutton{width:30px;height:40px;border:1px solid var(--cq-line);border-radius:4px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:13px;display:grid;grid-template-rows:1fr 14px;overflow:hidden;cursor:pointer;padding:0;box-sizing:border-box}
.qnbutton .num{display:grid;place-items:center}
.qnbutton .tl{background:var(--cq-info);border-top:1px solid var(--cq-line);display:grid;place-items:center;font-size:9px;color:#fff;line-height:1}
.qnbutton.ok .tl{background:var(--cq-ok)}.qnbutton.ok .tl::before{content:"✓"}
.qnbutton.bad .tl{background:var(--cq-bad)}.qnbutton.bad .tl::before{content:"✗"}

  supported(){ return !!window.showSaveFilePicker && !window.claude; },

  async idbSet(h){ return new Promise(res=>{ try{ const r=indexedDB.open('m3b',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>{ try{ const tx=r.result.transaction('kv','readwrite'); if(h) tx.objectStore('kv').put(h,'handle'); else tx.objectStore('kv').delete('handle'); tx.oncomplete=()=>res(); tx.onerror=()=>res(); }catch(e){ res(); } }; r.onerror=()=>res(); }catch(e){ res(); } }); },
  markDirty(){ if(!this.handle) return; this.dirty = true; this.render(); clearTimeout(this.timer); this.timer = setTimeout(()=>this.save(), 1500); },
  async save(){ if(!this.handle) return false; try{ const w = await this.handle.createWritable(); await w.write(JSON.stringify(STATE, null, 1)); await w.close(); this.dirty=false; this.savedAt=new Date(); this.render(); return true; }catch(e){ console.warn(e); toast('Kunne ikke lagre til fila – bruk «Lagre som»'); return false; } },

const COLLS = ['attempts','exams','sessions','todos','notes','settings'];
async function initStore(){
  const local = lsLoad(); if(local) STATE = Object.assign({attempts:{},exams:{},sessions:{},todos:{},notes:{},settings:{}}, local);
  try{
    if(window.claude && window.claude.use){
      const db = await window.claude.use('db');
      if(db){
        store = db;
        const snaps = await Promise.all(COLLS.map(c=>db.collection(c).get()));
        const any = snaps.some(s=>!s.empty);
        if(any){
          STATE = {attempts:{},exams:{},sessions:{},todos:{},notes:{},settings:{}};
          snaps.forEach((s,k)=>s.docs.forEach(d=>STATE[COLLS[k]][d.id]=d.data()));
        } else if(local){
          for(const c of COLLS) for(const [k,v] of Object.entries(local[c]||{})) await db.collection(c).doc(k).set(v);
        }
        lsSave();
      }
    }
  }catch(err){ console.warn('db utilgjengelig', err); store = null; }
}
async function saveDoc(coll, id, data){
  STATE[coll][id] = data; lsSave();
  if(store){ try{ await store.collection(coll).doc(id).set(data); }catch(err){ console.warn('lagring feilet', err); toast('Kunne ikke lagre til databasen – lagret lokalt.'); } }
}
async function deleteDoc(coll, id){ delete STATE[coll][id]; lsSave(); if(store){ try{ await store.collection(coll).doc(id).delete(); }catch(err){ console.warn('sletting feilet', err); } } }
async function deleteSession(s){
  const t0 = s.ts - 2000, t1 = (s.end || Date.now()) + 2000;
  for(const k of Object.keys(s.fields||{})){
    const a = STATE.attempts[k]; if(!a) continue;
    a.hist = (a.hist||[]).filter(r => !(r[0]>=t0 && r[0]<=t1 && r[2]===s.mode));
    if(!a.hist.length){ await deleteDoc('attempts', k); continue; }
    let streak = 0; for(const r of a.hist){ streak = r[1] ? streak+1 : 0; }
    a.streak = streak; a.last = a.hist[a.hist.length-1][0]; a.ok = a.hist[a.hist.length-1][1];
    await saveDoc('attempts', k, a);
  }
  await deleteDoc('sessions', s.id);
}
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

// ---------- Sammenligning av svar ----------
const FUNCS = new Set(['sin','cos','tan','asin','acos','atan','atan2','sinh','cosh','tanh','exp','log','log10','sqrt','abs','ln','cbrt','sign','floor','ceil','round','max','min']);
const CONSTS = new Set(['pi','e','i','Infinity','NaN','true','false']);
function normalize(s){ return String(s).trim().replace(/\*\*/g,'^').replace(/\bln\(/g,'log(').replace(/\bepsilon_0\b/g,'eps0').replace(/\\/g,'').replace(/,(?=\d)/g,'.').replace(/\s+/g,''); }
function freeVars(node){ const vars = new Set(); node.traverse((n, path, parent)=>{ if(n.isSymbolNode){ if(parent && parent.isFunctionNode && parent.fn === n) return; if(!FUNCS.has(n.name) && !CONSTS.has(n.name)) vars.add(n.name); } }); return vars; }
function toNumArray(v){ if(v && v.isMatrix) v = v.toArray(); if(Array.isArray(v)) return v.flat(Infinity).map(x=>toNum(x)); return [toNum(v)]; }
function toNum(x){ if(typeof x==='number') return x; if(x && x.isComplex){ return Math.abs(x.im) < 1e-9 ? x.re : NaN; } if(x && typeof x.valueOf==='function'){ const v = x.valueOf(); if(typeof v==='number') return v; } return Number(x); }
function checkExpr(user, ans, tol){
  try{
    const u = normalize(user), a = normalize(ans);
    if(!u) return {ok:false, reason:'tomt'};
    const nu = math.parse(u), na = math.parse(a);
    const vars = new Set([...freeVars(nu), ...freeVars(na)]);
    const cu = nu.compile(), ca = na.compile();
    const trials = vars.size ? 6 : 1; let rng = 0.37; const rand = () => { rng = (rng*9301+49297)%233280; return rng/233280; };
    for(let t=0;t<trials;t++){
      const scope = {}; vars.forEach(v=>{ scope[v] = 0.4 + 2.3*rand(); });
      let vu, va;
      try{ vu = toNumArray(cu.evaluate(Object.assign({},scope))); va = toNumArray(ca.evaluate(Object.assign({},scope))); }catch(e){ return {ok:false, reason:'kunne ikke regne ut uttrykket'}; }
      if(vu.length !== va.length) return {ok:false, reason:'feil antall komponenter'};
      for(let k=0;k<va.length;k++){ const x = vu[k], y = va[k]; if(!isFinite(x) || !isFinite(y)) return {ok:false, reason:'udefinert verdi'};
        const absTol = tol != null ? Math.max(tol, Math.abs(y)*1e-3) : Math.max(1e-6*Math.abs(y), 1e-7); if(Math.abs(x-y) > absTol) return {ok:false}; }
    }
    return {ok:true};
  }catch(e){ return {ok:false, reason:'syntaksfeil: ' + (e.message||'')}; }
}

// ---------- Historikk og mestring ----------
// hist-rad: [tidspunkt, riktig(1/0), modus, hint(1/0), fasitVist(1/0)]. Fasit vist før svar => riktig alltid 0.
function fieldKey(qid, i){ return qid + '_f' + i; }
function isAuto(f){ return f.kind==='expr' || f.kind==='choice' || f.kind==='pick' || f.kind==='mc'; }
function isGradable(f){ return f.kind!=='confirm' || true; } // alle felt kan registreres (selvsjekk for confirm/code/self)
async function recordAttempt(q, f, r){
  const k = fieldKey(q.id, f.i);
  const a = STATE.attempts[k] || {q:q.id, i:f.i, topic:q.topic, hist:[], streak:0};
  const ok = r.ok && !r.fasit ? 1 : 0;
  a.hist = (a.hist||[]).concat([[Date.now(), ok, r.mode, r.hint?1:0, r.fasit?1:0]]).slice(-20);
  a.streak = ok ? (a.streak||0)+1 : 0; a.last = Date.now(); a.ok = ok;
  await saveDoc('attempts', k, a);
}
function fieldScore(a){
  if(!a || !a.hist || !a.hist.length) return null;
  const h = a.hist.slice(-3).reverse(); const w=[0.5,0.3,0.2]; let s=0, ws=0;
  h.forEach((r,k)=>{ const v = (r[1]?1:0) * (r[3] ? 0.7 : 1); s += v*w[k]; ws += w[k]; });
  return s/ws;
}
function lastLabel(a){ if(!a||!a.hist||!a.hist.length) return null; const r=a.hist[a.hist.length-1]; return r[4]?'seen':(r[1]?'ok':'bad'); }
function questionScore(q){ const sc = q.fields.map(f=>fieldScore(STATE.attempts[fieldKey(q.id,f.i)])).filter(x=>x!=null); if(!sc.length) return null; return sc.reduce((a,b)=>a+b,0)/sc.length; }
function topicStats(){
  const out = {};
  for(const [k,t] of Object.entries(TOPICS)){
    if(t.fag) continue;
    const qs = Q.filter(q=>q.topic===k);
    const scores = qs.map(questionScore).filter(x=>x!=null);
    const exScores = [];
    EXAMS.forEach(ex=>ex.tasks.forEach(tk=>{ if(tk[2]===k){ const r = STATE.exams[ex.key+'_'+tk[0]]; if(r && r.score!=null) exScores.push(r.score); } }));
    const all = scores.concat(exScores);
    const mastery = all.length ? all.reduce((a,b)=>a+b,0)/all.length : null;

function dueFields(fag){

    const a = STATE.attempts[fieldKey(q.id,f.i)]; if(!a || !a.hist.length) return;
    const last = a.hist[a.hist.length-1];
    if(last[4]) { list.push({q,f,why:'Fasit vist sist'}); return; }
    if(!last[1]) { list.push({q,f,why:'Feil sist'}); return; }
    const streak = a.streak||1; const days = [1,3,7,14,30][Math.min(streak-1,4)];
    if(now - last[0] > days*86400000) list.push({q,f,why:'Repetisjon (' + days + ' d)'});

}

    if(fresh.length>=8-due.length) break;

}

function fieldsOf(item){ return Q.filter(q=>q.oving===item.oving && (!item.nr || item.nr.includes(q.nr))).flatMap(q=>q.fields.map(f=>({q,f}))); }
function itemStatus(item){
  if(item.type==='manual'){ const t = STATE.todos[item.id]; return {done:!!(t&&t.done), prog: t&&t.done?1:0, sub:''}; }
  if(item.type==='oving'){
    const fs = fieldsOf(item); if(!fs.length) return {done:false, prog:0, sub:''};
    const okc = fs.filter(({q,f})=>{ const a=STATE.attempts[fieldKey(q.id,f.i)]; return a && a.hist.some(r=>r[1]===1); }).length;
    const tried = fs.filter(({q,f})=>STATE.attempts[fieldKey(q.id,f.i)]).length;
    return {done: okc===fs.length, prog: okc/fs.length, sub:`${okc} av ${fs.length} felt riktig uten fasit · ${tried} forsøkt`};
  }
  if(item.type==='prove'){
    const ss = Object.values(STATE.sessions).filter(s=>s.oving===item.oving && s.mode==='prove' && s.done);
    const best = ss.length ? Math.max(...ss.map(s=>s.score||0)) : null;
    return {done: best!=null && best>=item.min, prog: best==null?0:Math.min(1,best/item.min), sub: best==null?'ingen prøve levert ennå':`beste prøve ${Math.round(best*100)} %`};
  }
  if(item.type==='exam'){
    const tasks = item.set ? EXBY[item.set].tasks.map(t=>[item.set,t[0]]) : item.tasks;
    const logged = tasks.filter(([s,n])=>STATE.exams[s+'_'+n]).length;

function weekOf(d=new Date()){ const t = d.toISOString().slice(0,10); return PLAN.find(w=>t>=w.start && t<=w.end) || (t<PLAN[0].start ? PLAN[0] : PLAN[PLAN.length-1]); }
function planStatus(){
  const now = new Date(); const cur = weekOf(now); const today = now.toISOString().slice(0,10);
  let behind = [], ahead = 0, curDone = 0, curTot = 0;
  PLAN.forEach(w=>w.items.forEach(it=>{ const s = itemStatus(it);
    if(w.end < today && !s.done) behind.push({w,it});
    else if(w.start > today && s.done) ahead++;
    if(w===cur){ curTot++; if(s.done) curDone++; } }));
  const days = (new Date(cur.end) - new Date(cur.start))/86400000 + 1;
  const elapsed = Math.min(days, Math.max(0, (now - new Date(cur.start))/86400000 + 1));
  const expected = elapsed/days; const actual = curTot ? curDone/curTot : 1;
  let label, cls;
  if(behind.length) { label = `Bak planen – ${behind.length} gjøremål fra tidligere uker gjenstår`; cls='bad'; }
  else if(actual >= Math.min(1, expected + 0.15)) { label = ahead ? `Foran planen – ${ahead} gjøremål fra senere uker er gjort` : 'Foran planen denne uka'; cls='good'; }
  else if(actual >= expected - 0.2) { label = 'I rute med planen'; cls='good'; }
  else { label = `Litt bak denne uka – ${curTot-curDone} gjøremål gjenstår`; cls='warn'; }
  return {cur, behind, ahead, curDone, curTot, expected, actual, label, cls};
}

function sessionSummary(s){
  const v = Object.values(s.fields||{}); const ok = v.filter(x=>x.r==='ok').length, bad = v.filter(x=>x.r==='feil').length, seen = v.filter(x=>x.r==='fasit').length;
  if(s.mode==='prove' && s.done) return `${s.got}/${s.tot} riktig (${Math.round((s.score||0)*100)} %)${s.sek?` · ${Math.floor(s.sek/60)} min`:''}`;
  return `${ok} riktig · ${bad} feil · ${seen} fasit vist`;
}

function renderText(q, mode){
  let t = esc(q.text);
  t = t.replace(/\[BILDE:\s*([^\]]*)\]/g, (m,alt)=>`<span class="fig">Figur${alt.trim()?': '+alt.trim():''} (vises i Capquiz)</span>`);
  const lines = t.split('\n'); const out=[]; let code=[];
  const isCode = l => /^(import |from |def |for |if\(|if |elif |else:|return |print\(|plt\.|np\.|sp\.|pts|tri |p = |q = |r = |u = |v = |n = |avg|x = |y = |f = |z = |dx|dy|dA|svar|area|numSim|numHit|xmin|xmax|ymin|ymax|numx|numy|numval|a = |b = |c = |t = |xv|yv|I = |x,y|velx|vely|Muv|triangles|R = |rho_hat|#|\s{4}\S)/.test(l) && !/\\\(|\\\[|\$/.test(l);
  const flush = ()=>{ if(code.length){ out.push('<pre>'+code.join('\n')+'</pre>'); code=[]; } };
  for(const l of lines){ if(isCode(l)) code.push(l); else { if(l.trim()===''){ if(code.length) code.push(''); else out.push(''); } else { flush(); out.push(l); } } }
  flush();
  let html = out.join('\n').replace(/\n{2,}/g,'</p><p>').replace(/(?<!<\/pre>)\n/g,'<br>');
  html = '<p>'+html+'</p>';
  html = html.replace(/<p>\s*<\/p>/g,'').replace(/<p><pre>/g,'<pre>').replace(/<\/pre><\/p>/g,'</pre>');
  html = html.replace(/\{\{f(\d+)\}\}/g, (m,i)=>fieldHtml(q, +i, mode));
  return html;
}
function fieldHtml(q, i, mode){
  const f = q.fields.find(x=>x.i===i); if(!f) return '';
  const id = `fld_${q.id}_${i}`; const multi = q.fields.length>1; const tag = multi ? `<span class="tag">${i}</span>` : '';
  const chk = mode==='ov' ? `<button class="btn small chk" data-q="${q.id}" data-i="${i}">Sjekk</button>` : '';
  if(f.kind==='choice') return `<span class="fld" data-q="${q.id}" data-i="${i}">${tag}<select id="${id}"><option value="">– velg –</option>${f.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>${chk}<span class="st"></span></span>`;
  if(f.kind==='code') return `<span class="fld" data-q="${q.id}" data-i="${i}" style="display:block">${tag}<textarea class="code" id="${id}" aria-label="Koden din (rettes ikke automatisk)"></textarea></span>`;
  if(f.kind==='confirm') return `<span class="fld" data-q="${q.id}" data-i="${i}">${tag}<input type="text" id="${id}" autocomplete="off" spellcheck="false" aria-label="Svaret ditt (rettes ikke automatisk)"><span class="st"></span></span>`;
  if(f.kind==='self') return `<span class="fld" data-q="${q.id}" data-i="${i}">${tag}<input type="text" id="${id}"><span class="st muted">vurderes mot fasit under</span></span>`;
  return `<span class="fld" data-q="${q.id}" data-i="${i}">${tag}<input type="text" id="${id}" autocomplete="off" spellcheck="false">${chk}<span class="st"></span></span>`;
}
function mdInline(t){ // $..$ beholdes for MathJax, `kode` -> <code>, *kursiv*
  return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*([^*$]+)\*/g,'<em>$1</em>');
}
function stepsHtml(q){
  if(!q.steg||!q.steg.length) return '<p class="muted small">Ingen stegvis utregning lagt inn for denne oppgaven ennå.</p>';
  return `<ol class="steps">${q.steg.map(st=>`<li><div class="st-t">${esc(st.t)}${st.ref?` <a class="pill mute stref" href="#komp-${st.ref}" target="_blank" rel="noopener" title="Åpne §${esc(st.ref)} i kompendiet i ny fane">§${esc(st.ref)} ↗</a>`:''}</div><div class="st-s">${mdInline(st.s)}</div></li>`).join('')}</ol>`;
}
function ansHtml(f){
  if(f.kind==='code') return `<pre class="mono" style="white-space:pre-wrap;margin:0">${esc(f.ref||'')}</pre>`;
  if(f.kind==='confirm') return '<span class="muted">Se forklaringen – oppgaven vurderes med selvsjekk.</span>';
  return `<code>${esc(f.ans||'–')}</code>`;
}

// ctx: {mode:'ov'|'fri', sess (ev.), hints:0, usedHint:false, answered:Set, seen:Set, res:{feltnøkkel:'ok'|'bad'|'seen'}}
function stateOf(q, res){ // samlet status for en oppgave ut fra feltresultatene
  const rs = q.fields.map(f=>res[fieldKey(q.id,f.i)]).filter(Boolean);
  if(!rs.length) return {cls:'', txt:'Ikke besvart'};
  if(rs.some(r=>r==='seen')) return {cls:'seen', txt:'Fasit vist'};
  const ok = rs.filter(r=>r==='ok').length;
  if(ok===q.fields.length) return {cls:'ok', txt:'Riktig'};
  if(ok===0) return {cls:'bad', txt:'Feil'};
  return {cls:'part', txt:'Delvis riktig'};
}
function komma(x){ return (x==null?1:x).toFixed(2).replace('.',','); }

function attachHelp(root, q, ctx){

        if(!ctx.seen.has(k)){ ctx.seen.add(k); await recordAttempt(q,f,{ok:false,mode:ctx.mode,hint:ctx.usedHint,fasit:true}); if(ctx.sess) await sessField(ctx.sess, k, {r:'fasit', hint:ctx.usedHint?1:0}); }

      section('fas', `${note}<h4>Fasit${q.fields.length>1?' – felt '+f.i:''}</h4><p class="rightanswer">Riktig svar er: ${ansHtml(f)}</p>${q.fields.length>1?`<details style="margin:0 0 10px"><summary class="small" style="cursor:pointer">Fasit for alle felt i oppgaven</summary><div class="stack" style="gap:4px;margin-top:6px">${q.fields.map(x=>`<div><span class="small">Felt ${x.i}:</span> ${ansHtml(x)}</div>`).join('')}</div></details>`:''}
        <h4>Utregning steg for steg</h4>${stepsHtml(q)}

    };
    const selfBtn = (ok) => async ()=>{
      if(ctx.seen.has(k) && ok && !(ctx.compare && ctx.compare.has(k))) return;

      ctx.answered.add(k);
      await recordAttempt(q,f,{ok,mode:ctx.mode,hint:ctx.usedHint,fasit:false}); if(ctx.sess) await sessField(ctx.sess, k, {r:ok?'ok':'feil', hint:ctx.usedHint?1:0});
      st.textContent = ok?'Registrert: fikk til':'Registrert: fikk ikke til'; wrap.classList.add(ok?'ok':'bad'); setRes(k, ok?'ok':'bad'); toast(ok?'Registrert som riktig':'Registrert – kommer tilbake i dagens økt');
    };

    if(f.kind==='card'){
      const fl = wrap.querySelector('.flip'), cb = wrap.querySelector('.cardback'), cok = wrap.querySelector('.c-ok'), cbad = wrap.querySelector('.c-bad');
      if(fl) fl.onclick = ()=>{ cb.hidden = !cb.hidden; fl.textContent = cb.hidden ? 'Snu kortet' : 'Skjul baksiden'; if(!cb.hidden && !ctx.answered.has(k)){ cok.hidden = false; cbad.hidden = false; } typeset(cb); };
      const cardRate = ok => async ()=>{ if(ctx.answered.has(k)) return; await selfBtn(ok)(); cok.disabled = true; cbad.disabled = true; const ws = wrap.querySelector('.st'); if(ws) ws.textContent = ok ? 'Registrert: kunne det' : 'Registrert: kommer tilbake i repetisjonen'; };

    const f = q.fields.find(x=>x.i===+b.dataset.i); const wrap = b.closest('.fld'); const inp = wrap.querySelector('input[type=text],select') || wrap.querySelector('input[type=radio]'); const st = wrap.querySelector('.st'); const k = fieldKey(q.id,f.i);
    const pst = root.querySelector(`.help[data-i="${f.i}"] .hd .st`);

    { const r = gradeField(f, val); ok = r.ok; reason = r.reason||''; }
    const fb = wrap.querySelector('.mcfb');
    if(fb && f.kind==='mc' && f.why){ fb.hidden = false; fb.innerHTML = (ok ? `<strong>Riktig.</strong> ${mdInline(f.why[val]||'')}` : `<strong>Ikke riktig.</strong> ${mdInline(f.why[val]||'')}<br><span class="small">Se «Svar og forklaring» for riktig alternativ.</span>`); typeset(fb); }
    wrap.classList.remove('ok','bad','seen');
    if(ctx.seen.has(k)){ wrap.classList.add(ok?'ok':'bad'); st.textContent = ok ? 'Riktig – men fasit var vist, teller ikke' : 'Feil (fasit vist)'; return; }
    wrap.classList.add(ok?'ok':'bad'); st.textContent = ok ? 'Riktig svar, godt jobbet.' : ('Feil svar.' + (reason?' '+reason:'')); st.title = reason;
    ctx.answered.add(k);
    await recordAttempt(q,f,{ok,mode:ctx.mode,hint:ctx.usedHint,fasit:false}); if(ctx.sess) await sessField(ctx.sess, k, {r:ok?'ok':'feil', hint:ctx.usedHint?1:0});
    if(pst) pst.textContent = ''; setRes(k, ok?'ok':'bad');

  });
  // Enter = Sjekk

}
async function sessField(s, k, data){ s.fields = s.fields||{}; const cur = s.fields[k]; if(cur && cur.r==='ok') return; if(cur && cur.r==='fasit' && data.r!=='fasit') return; s.fields[k] = Object.assign({ts:Date.now()}, data); await saveDoc('sessions', s.id, s); }
const R2C = {ok:'ok', feil:'bad', fasit:'seen'};

function renderFree(main, qid){

  const ctx = {mode:'fri', hints:0, usedHint:false, answered:new Set(), seen:new Set(), res:{}};

  main.innerHTML = `<div class="cq"><div class="cq-main">
    <div class="cq-head"><div class="row small muted"><a href="#oving-${q.oving}">${ovName(q.oving)}</a> › Fri øving</div><span class="small muted">Svarene lagres i historikken</span></div>
    ${queHtml(q, 'ov', stateOf(q, {}))}
    <div class="cq-foot">${prev?`<a class="btn sec" href="#q-${prev.id}">Forrige side</a>`:'<span></span>'}${next?`<a class="btn primary" href="#q-${next.id}">Neste side</a>`:`<a class="btn primary" href="#oving-${q.oving}">Tilbake til ${ovName(q.oving).toLowerCase()}</a>`}</div>
  </div>${navBlockHtml(qs, idx, hist, '', `<a class="fin" href="#oving-${q.oving}">Start et forsøk …</a><div class="small muted" style="margin-top:6px">Fargene viser historikken din.</div>`)}</div>`;
  attachHelp(main, q, ctx);
  main.querySelectorAll('.qnbutton').forEach(a=>a.onclick=e=>{ e.preventDefault(); location.hash = '#q-' + a.dataset.q; });
}

// ---------- Forsøk (økt) ----------
function renderAttempt(main, sid){
  const s = STATE.sessions[sid]; if(!s){ main.innerHTML='<p>Fant ikke forsøket.</p>'; return; }
  if(s.mode==='prove') return renderProve(main, s);
  const qs = s.qs.map(id=>QBY[id]).filter(Boolean);
  if(s.done) return renderAttemptResult(main, s, qs);
  const idx = Math.min(s.idx||0, qs.length-1); const q = qs[idx];
  const resOf = x => { const r = {}; x.fields.forEach(f=>{ const v=(s.fields||{})[fieldKey(x.id,f.i)]; if(v) r[fieldKey(x.id,f.i)] = R2C[v.r]; }); return r; };
  const ctx = {mode:'ov', sess:s, hints:0, usedHint:false, res:resOf(q),
    answered:new Set(Object.keys(s.fields||{}).filter(k=>k.startsWith(q.id+'_') && s.fields[k].r!=='fasit')), seen:new Set(Object.keys(s.fields||{}).filter(k=>k.startsWith(q.id+'_') && s.fields[k].r==='fasit'))};
  main.innerHTML = `<div class="cq"><div class="cq-main">
    <div class="cq-head"><div class="row small muted"><a href="#oving-${s.oving}">${esc(ovName(s.oving))}</a> › Forsøk i øvingsmodus · startet ${fmtDate(s.ts)}</div><span class="small muted">Spørsmål ${idx+1} av ${qs.length}</span></div>
    ${queHtml(q, 'ov', stateOf(q, ctx.res))}
    <div class="cq-foot">${idx>0?`<button class="btn sec" data-go="${idx-1}">Forrige side</button>`:'<span></span>'}${idx<qs.length-1?`<button class="btn primary" data-go="${idx+1}">Neste side</button>`:`<button class="btn primary" id="avslutt2">Fullfør forsøk …</button>`}</div>
  </div>${navBlockHtml(qs, idx, x=>stateOf(x, resOf(x)).cls, '', `<a class="fin" href="#" id="avslutt">Fullfør forsøk …</a>`)}</div>`;
  attachHelp(main, q, ctx);
  main.querySelectorAll('[data-go]').forEach(b=>b.onclick=async ()=>{ s.idx = +b.dataset.go; await saveDoc('sessions', s.id, s); route(); });
  main.querySelectorAll('.qnbutton').forEach(a=>a.onclick=async e=>{ e.preventDefault(); s.idx = +a.dataset.k; await saveDoc('sessions', s.id, s); route(); });
  const finish = async e=>{ if(e) e.preventDefault(); s.done = 1; s.end = Date.now(); await saveDoc('sessions', s.id, s); route(); };
  $('#avslutt').onclick = finish; if($('#avslutt2')) $('#avslutt2').onclick = finish;
  // vis tidligere resultater i dette forsøket på feltene
  q.fields.forEach(f=>{ const r = (s.fields||{})[fieldKey(q.id,f.i)]; if(!r) return; const wrap = main.querySelector(`.fld[data-i="${f.i}"]`); if(!wrap) return; wrap.classList.add(R2C[r.r]); const st=wrap.querySelector('.st'); if(st) st.textContent = r.r==='ok'?'Riktig svar, godt jobbet.':r.r==='feil'?'Feil svar.':'Fasit vist'; });
}
function q2status(s, q){ const rs = q.fields.map(f=>(s.fields||{})[fieldKey(q.id,f.i)]).filter(Boolean); if(!rs.length) return ''; if(rs.some(r=>r.r==='fasit')) return 'seen'; if(rs.every(r=>r.r==='ok')) return 'ok'; return 'bad'; }
function renderAttemptResult(main, s, qs){
  const v = Object.values(s.fields||{}); const ok = v.filter(x=>x.r==='ok').length, bad = v.filter(x=>x.r==='feil').length, seen = v.filter(x=>x.r==='fasit').length;
  const tot = qs.reduce((a,q)=>a+q.fields.length,0);
  main.innerHTML = `<div class="row small muted" style="margin-bottom:6px"><a href="#oving-${s.oving}">${ovName(s.oving)}</a> › Forsøk i øvingsmodus · ${fmtDate(s.ts)}</div><h1>Resultat av forsøket</h1>
  <div class="grid g4" style="margin:14px 0"><div class="card kpi"><div class="n" style="color:var(--good)">${ok}</div><div class="l">felt riktig uten fasit</div></div><div class="card kpi"><div class="n" style="color:var(--bad)">${bad}</div><div class="l">felt feil</div></div><div class="card kpi"><div class="n" style="color:var(--warn)">${seen}</div><div class="l">felt med fasit vist før svar</div></div><div class="card kpi"><div class="n">${tot-ok-bad-seen}</div><div class="l">felt ikke besvart</div></div></div>
  <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Oppgave</th><th>Tema</th><th>Felt</th><th></th></tr></thead><tbody>${qs.map(q=>{ const rs=q.fields.map(f=>(s.fields||{})[fieldKey(q.id,f.i)]); const st = q2status(s,q);
    return `<tr><td>${q.nr} · ${esc(q.title)}</td><td class="small muted">${esc(shortTopic(TOPICS[q.topic].navn))}</td><td>${rs.map(r=>`<span class="pill ${!r?'mute':r.r==='ok'?'good':r.r==='feil'?'bad':'warn'}">${!r?'–':r.r==='ok'?'riktig':r.r==='feil'?'feil':'fasit'}</span>`).join(' ')}</td><td class="num"><a class="btn small" href="#q-${q.id}">${st==='ok'?'Se':'Øv igjen'}</a></td></tr>`; }).join('')}</tbody></table></div></div>
  <div class="row" style="margin-top:14px"><a class="btn primary" href="#oving-${s.oving}">Start nytt forsøk</a><a class="btn" href="#oversikt">Til oversikten</a></div>`;
}
function renderProve(main, s){
  const qs = s.qs.map(id=>QBY[id]).filter(Boolean); const n = s.oving;
  if(s.done){
    main.innerHTML = `<div class="row small muted" style="margin-bottom:6px"><a href="#oving-${n}">${esc(ovName(n))}</a> › Prøvemodus · ${fmtDate(s.ts)}</div><h1>Resultat: ${s.got}/${s.tot} felt riktig (${Math.round((s.score||0)*100)} %)</h1><p class="lead">Brukt tid ${Math.floor((s.sek||0)/60)} min ${(s.sek||0)%60} s.</p>
    <div class="card"><div class="tblwrap"><table class="tbl"><thead><tr><th>Oppgave</th><th>Tema</th><th>Riktig</th><th></th></tr></thead><tbody>${(s.rows||[]).map(r=>{ const q=QBY[r.q]; return `<tr><td>${q.nr} · ${esc(q.title)}</td><td class="small muted">${esc(shortTopic(TOPICS[q.topic].navn))}</td><td class="num">${r.qn?r.qg+'/'+r.qn:'<span class="muted">selvsjekk</span>'}</td><td class="num"><a class="btn small" href="#q-${q.id}">Øv med hint</a></td></tr>`; }).join('')}</tbody></table></div></div>
    <div class="row" style="margin-top:14px"><a class="btn primary" href="#oving-${n}">Start nytt forsøk</a><a class="btn" href="#oversikt">Til oversikten</a></div>`; return;
  }
  const start = s.ts;
  main.innerHTML = `<div class="cq"><div class="cq-main">
    <div class="cq-head"><div class="row small muted"><a href="#oving-${n}">${ovName(n)}</a> › Prøvemodus</div><span class="small muted">Ingen hint eller fasit før du leverer</span></div>
    ${qs.map(q=>queHtml(q, 'prove', {cls:'', txt:'Ikke besvart'}, `id="pq_${q.id}"`)).join('')}
    <div class="cq-foot"><a class="btn sec" href="#oving-${n}">Avbryt</a><button class="btn primary" id="lever">Fullfør forsøk …</button></div><div id="result"></div>
  </div>${navBlockHtml(qs, -1, ()=>'', `<span class="small muted">Tid brukt</span><span class="timer" id="timer">00:00</span>`, `<a class="fin" href="#" id="lever2">Fullfør forsøk …</a>`)}</div>`;
  main.querySelectorAll('.qnbutton').forEach(a=>a.onclick=e=>{ e.preventDefault(); const el = $('#pq_'+a.dataset.q); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); });
  const tm = setInterval(()=>{ const el=$('#timer'); if(!el){ clearInterval(tm); return; } const t=Math.floor((Date.now()-start)/1000); el.textContent = String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); },1000);
  let levert = false;
  const lever = async e=>{
    if(e) e.preventDefault(); if(levert) return;
    const tomme = qs.reduce((a,q)=>a+q.fields.filter(isAuto).filter(f=>{ const w=main.querySelector(`#pq_${q.id} .fld[data-i="${f.i}"]`); if(!w) return false; const v = readField(w,f); return v==='' || v==null || (typeof v==='string' && !v.trim()); }).length,0);
    if(!confirm(`Levere prøven?${tomme?` ${tomme} felt er ikke besvart.`:''} Etter levering kan du ikke endre svarene.`)) return;
    levert = true; clearInterval(tm); let tot=0, got=0; const rows=[]; s.fields = {};
    for(const q of qs){

          const ok = gradeField(f, readField(wrap, f)).ok;
          wrap.classList.add(ok?'ok':'bad'); if(st) st.textContent = ok?'Riktig svar.':(f.kind==='pick'||f.kind==='mc' ? 'Feil svar. Riktig alternativ er nr. '+(f.ans+1)+' ovenfra.' : 'Feil svar. Riktig svar er: '+f.ans); wrap.querySelectorAll('input,select').forEach(x=>x.disabled = true);
          qn++; if(ok) qg++; await recordAttempt(q,f,{ok,mode:'prove',hint:false,fasit:false}); s.fields[fieldKey(q.id,f.i)] = {r:ok?'ok':'feil', hint:0, ts:Date.now()};
        }

      if(qn){ tot+=qn; got+=qg;
        const stt = qg===qn?{cls:'ok',txt:'Riktig'}:qg===0?{cls:'bad',txt:'Feil'}:{cls:'part',txt:'Delvis riktig'};
        const el = main.querySelector(`#pq_${q.id} .info .state`); el.className='state '+stt.cls; el.textContent=stt.txt;
        main.querySelector(`#pq_${q.id} .info .grade`).textContent = `Karakter ${komma(qg/qn*(q.maxp||1))} av ${komma(q.maxp||1)}`;
        const nb = main.querySelector(`.qnbutton[data-q="${q.id}"]`); if(nb) nb.classList.add(stt.cls); }
      rows.push({q:q.id,qn,qg});
    }
    Object.assign(s, {done:1, score: tot? got/tot : 0, got, tot, sek:Math.floor((Date.now()-start)/1000), rows, end:Date.now()});
    await saveDoc('sessions', s.id, s);

    $('#lever').disabled = true; $('#result').scrollIntoView({behavior:'smooth'});
  };
  $('#lever').onclick = lever; $('#lever2').onclick = lever;
}

  <p><strong>Mekanikk 1.</strong> Eksamen H25 og H24 er lagt inn deloppgave for deloppgave fra Inspera-utskriftene, med originale figurer (klikk for å forstørre). Tall- og flervalgssvar rettes mot fasiten i utskriften, og løsningsforslaget vises side for side med dokument og sidetall. Egne mellomregninger er merket «Supplerende forklaring». Eldre sett ligger som PDF med logging av poengsum.</p>
  <p><strong>Elementmetoden.</strong> Spørsmålene er egenlagde og merket med kilde (forelesning og lysbilde eller side). Flashcards kan snus uten at det teller som fasit vist; skriftlige svar kan sammenlignes med modellsvaret når du har skrevet noe selv. Spørsmål du bommer på kommer tilbake i repetisjonen.</p>
  <p><strong>For educational purposes only.</strong> Oppgavetekstene er hentet ordrett fra de obligatoriske øvingene og repetisjonsøvingene i IMAx3012 (Capquiz, NTNU høsten 2026) og brukes kun til egen eksamensforberedelse. Hint, forklaringer og pensumsider peker til kompendiet «Forelesningsnotater Matematikk 3B (IMAx3012)», versjon 2. november 2026 (sidene vises som bilder under «Pensum»), og til forelesningsslidene F1–F26.</p>
  <p><strong>Retting.</strong> Svar sammenlignes numerisk med fasit: uttrykk med variabler evalueres i flere punkter, tall sammenlignes innenfor toleransen oppgaven oppgir. Skriv som i Capquiz: <code class="mono">sqrt(2)</code>, <code class="mono">pi/4</code>, <code class="mono">x^2</code> eller <code class="mono">x**2</code>, <code class="mono">[1,2,3]</code>, <code class="mono">theta</code>, <code class="mono">rho</code>, <code class="mono">phi</code>, <code class="mono">exp(x)</code>, <code class="mono">log(x)</code> for naturlig logaritme. Enter i et felt er det samme som «Sjekk».</p>
  <p><strong>Historikk.</strong> Hvert svar lagres med tidspunkt, riktig/feil, modus (øving, prøve, fri), om hint var brukt og om fasit var vist før svaret. Et felt der fasit ble vist før svar registreres som «fasit vist» og teller aldri som riktig – det kommer tilbake i «Dagens økt» til du klarer det uten fasit. Svar med hint teller 70 %. Mestring per felt er vektet over de tre siste svarene (50/30/20 %); tema-mestring er snittet over oppgavene du har prøvd pluss loggede eksamensoppgaver. Repetisjon forfaller etter 1, 3, 7, 14 og 30 dager for hvert riktige svar på rad.</p>
  <p><strong>Faner.</strong> Kompendium-menyen og alle «↗»-lenker åpner en fane inne i øvingsrommet, så du kan hoppe mellom forsøket og kompendiet uten å miste noe. Fanelinja vises øverst når du har mer enn én fane; lukk med ×.</p>
  <p><strong>Gjøremål.</strong> Planen fram til eksamen er delt i gjøremål per uke. Øvings-, prøve- og eksamensgjøremål hukes av automatisk ut fra historikken; lesing og innlevering huker du av selv. Statusen øverst sier om du ligger foran, i rute eller bak.</p>
  <p class="small muted">${store?'Historikken lagres i sidens database og følger deg mellom enheter.':FILE.supported()?'<strong>Historikkfil.</strong> Øverst på siden kan du velge «Lagre som …» for å opprette en historikkfil (JSON) på PC-en, eller «Åpne historikk» for å fortsette fra en fil. Når en fil er åpen, lagres hvert svar automatisk til fila (status øverst), og neste gang du åpner øvingsrommet kan du trykke «Fortsett». Hver person bruker sin egen fil – så flere kan dele samme mappe/repo uten å blande historikk. Uten fil ligger historikken bare i denne nettleseren.':'Historikken lagres lokalt i denne nettleseren (localStorage). Ta en sikkerhetskopi med knappen under før du bytter maskin eller nettleser.'}</p>
  <div class="row">${window.claude?'':'<button class="btn" id="exp">Last ned historikk (JSON)</button>'}<label class="btn">Importer historikk <input type="file" id="imp" accept="application/json" hidden></label><button class="btn" id="nuke" style="color:var(--bad)">Slett all historikk</button></div></div>`;

const TABS = {
  list: [], active: 0,
  load(){ try{ const d = JSON.parse(sessionStorage.getItem('m3b_tabs')||'null'); if(d && d.list && d.list.length){ this.list=d.list; this.active=Math.min(d.active||0, d.list.length-1); } }catch(e){} if(!this.list.length) this.list=[{hash:location.hash||'#hjem', title:'Hjem'}]; },
  save(){ try{ sessionStorage.setItem('m3b_tabs', JSON.stringify({list:this.list, active:this.active})); }catch(e){} },
  cur(){ return this.list[this.active]; },
  prev:null,
  back(){ const ok = t => t && !t.hash.startsWith('#notater') && !t.hash.startsWith('#komp'); const p = this.list.find(t=>t.hash===this.prev); if(ok(p)) return p; return this.list.find((t,i)=>i!==this.active && ok(t)) || null; },
  open(hash){ this.prev = this.cur().hash; const k = this.list.findIndex(t=>t.hash===hash); if(k>=0){ this.active=k; } else { this.list.push({hash, title:titleFor(hash)}); this.active=this.list.length-1; } this.save(); this.go(); },
  close(k){ this.list.splice(k,1); if(!this.list.length) this.list=[{hash:'#oversikt',title:'Oversikt'}]; if(this.active>=this.list.length) this.active=this.list.length-1; else if(k<this.active) this.active--; this.save(); this.go(); },
  switch(k){ this.prev = this.cur().hash; this.active=k; this.save(); this.go(); },
  go(){ const h = this.cur().hash; if(location.hash!==h) location.hash = h; else route(); },
  sync(h){ const t=this.cur(); t.hash=h; t.title=titleFor(h); this.save(); this.render(); },
  render(){ const bar = $('#tabs'); if(!bar) return; if(this.list.length<2){ bar.hidden=true; bar.innerHTML=''; return; } bar.hidden=false;
    bar.innerHTML = this.list.map((t,k)=>`<div class="tab ${k===this.active?'on':''}" data-k="${k}" title="${esc(t.hash)}"><span class="tt">${esc(t.title)}</span><button class="x" data-k="${k}" title="Lukk fanen" aria-label="Lukk fanen">×</button></div>`).join('') + `<button class="tab plus" id="tab-plus" title="Ny fane (oversikt)">+</button>`;
    bar.querySelectorAll('.tab[data-k]').forEach(el=>el.onclick=e=>{ if(e.target.classList.contains('x')) return; this.switch(+el.dataset.k); });
    bar.querySelectorAll('.x').forEach(b=>b.onclick=e=>{ e.stopPropagation(); this.close(+b.dataset.k); });
    $('#tab-plus').onclick=()=>{ this.list.push({hash:'#oversikt',title:'Oversikt'}); this.active=this.list.length-1; this.save(); this.go(); };
  }
};
function titleFor(h){
  h = h.replace(/^#/,'');
  if(h==='hjem'||h==='') return 'Hjem'; if(h==='kalender') return 'Kalender'; if(h==='gjoremal-matte') return 'Ukeplan (matte)';
  if(h==='fag-mek') return 'Mekanikk 1'; if(h==='fag-fem') return 'Elementmetoden';
  if(h==='oversikt') return 'Matte 3B'; if(h==='gjoremal') return 'Gjøremål'; if(h==='ovinger') return 'Øvinger'; if(h==='eksamen') return 'Eksamenssett'; if(h==='om') return 'Om'; if(h==='notater') return 'Notater'; if(h==='komp') return 'Kompendium';
  if(h.startsWith('komp-')) { const sec=(window.BANK.sections||[]).find(x=>x.key===h.slice(5)); return 'Komp. §'+h.slice(5)+(sec?' '+sec.title.split(' ').slice(0,3).join(' '):''); }
  if(h.startsWith('oving-')) { const k = h.slice(6); return ovName(/^\d+$/.test(k) ? +k : k); }
  if(h.startsWith('q-')) { const q=QBY[h.slice(2)]; return q? ovShort(q.oving)+'.'+q.nr+' '+stripMd(q.title) : 'Oppgave'; }
  if(h.startsWith('forsok-')) { const s=STATE.sessions[h.slice(7)]; return s? ovName(s.oving)+' · '+(s.mode==='prove'?'prøve':'forsøk') : 'Forsøk'; }
  return h;
}

function qsOfAct(a){ if(a.type==='qs') return a.qs.map(id=>QBY[id]).filter(Boolean); if(a.type==='set') return Q.filter(q=>q.oving===a.set); return []; }
function actStatus(a){
  const ov = STATE.todos[a.id];
  let st;
  if(a.type==='qs' || a.type==='set'){
    const fs = qsOfAct(a).flatMap(q=>q.fields.map(f=>STATE.attempts[fieldKey(q.id,f.i)]));
    const tried = fs.filter(x=>x && x.hist && x.hist.length), ok = tried.filter(x=>x.hist.some(r=>r[1]===1));
    const ts = tried.reduce((m,x)=>Math.max(m, x.hist[x.hist.length-1][0]), 0);
    st = {done: fs.length>0 && tried.length===fs.length, prog: fs.length? tried.length/fs.length : 0, sub:`${tried.length} av ${fs.length} felt besvart · ${ok.length} riktig`, ts};
  } else if(a.type==='examscore'){
    const r = STATE.exams['mek-'+a.set];
    st = {done: !!r, prog: r?1:0, sub: r? `logget ${r.score}/${r.max||100} poeng` : 'ikke logget ennå', ts: r? r.ts : 0};
  } else if(a.item && a.type!=='manual'){
    const s = itemStatus(a.item);
    let ts = 0;
    if(s.done){ if(a.type==='oving') fieldsOf(a.item).forEach(({q,f})=>{ const x=STATE.attempts[fieldKey(q.id,f.i)]; if(x&&x.hist.length) ts=Math.max(ts, x.hist[x.hist.length-1][0]); });
      else if(a.type==='prove') Object.values(STATE.sessions).forEach(s2=>{ if(s2.oving===a.item.oving&&s2.mode==='prove'&&s2.done) ts=Math.max(ts, s2.end||s2.ts); });
      else if(a.type==='exam') Object.values(STATE.exams).forEach(r=>{ if(r.ts) ts=Math.max(ts, r.ts); }); }
    st = {done:s.done, prog:s.prog, sub:s.sub, ts};
  } else {
    st = {done: !!(ov && ov.done), prog: ov && ov.done ? 1 : 0, sub:'', ts: ov ? ov.ts : 0};
  }
  st.auto = a.type!=='manual';
  if(!st.done && ov && ov.done){ st.done = true; st.manual = true; st.ts = ov.ts; st.sub = (st.sub?st.sub+' · ':'')+'merket som gjort'; }
  return st;
}
function actLink(a){

// ---------- Kapasitet og planlegging ----------
function planSettings(){ const s = (STATE.settings||{}).plan || {}; return {cap: s.cap!=null ? s.cap : 360, days: s.days || {}}; }
async function savePlanSettings(p){ await saveDoc('settings','plan', p); }
function capOf(d, ps){
  ps = ps || planSettings();
  if(ps.days[d]!=null) return ps.days[d];
  if(d > PLAN_END) return 0;
  if(FAG_ORDER.some(f=>FAG[f].exam===d)) return Math.min(ps.cap, 120); // eksamensdag
  return ps.cap;
}
function dayRange(a, b){ const out=[]; for(let d=a; d<=b; d=addDays(d,1)) out.push(d); return out; }
function doneOn(d){ return ACTS.map(a=>({a, st:actStatus(a)})).filter(x=>x.st.done && x.st.ts && iso(new Date(x.st.ts))===d); }
let PLAN_CACHE = null;
function buildPlan(){
  const ps = planSettings(), today = todayStr();
  const all = ACTS.map(a=>({a, st:actStatus(a)}));
  const pend = all.filter(x=>!x.st.done && todayStr() <= lastStudy(x.a.fag)).map(x=>({a:x.a, st:x.st, rem: Math.max(10, Math.round(x.a.min*(1-(x.st.prog||0))/5)*5)}));
  const doneToday = all.filter(x=>x.st.done && x.st.ts && iso(new Date(x.st.ts))===today).reduce((s,x)=>s+x.a.min,0);
  const excluded = new Set(); let res;
  for(let iter=0; iter<60; iter++){
    res = schedule(pend.filter(p=>!excluded.has(p.a.id)), ps, today, doneToday);
    if(!res.overflow.length) break;
    let dropped = false;
    for(const f of new Set(res.overflow.map(o=>o.a.fag))){
      const cand = pend.filter(p=>p.a.fag===f && !excluded.has(p.a.id) && (p.a.pri||2)>1).sort((x,y)=>(y.a.pri-x.a.pri)||(y.a.order-x.a.order))[0];
      if(cand){ excluded.add(cand.a.id); dropped = true; }
    }
    if(!dropped) break;
  }
  res.excluded = pend.filter(p=>excluded.has(p.a.id));
  res.doneToday = doneToday; res.ps = ps;
  res.remaining = {}; res.available = {};
  FAG_ORDER.forEach(f=>{ res.remaining[f] = pend.filter(p=>p.a.fag===f).reduce((s,p)=>s+p.rem,0); });
  PLAN_CACHE = res; return res;
}
function schedule(items, ps, today, doneToday){
  const days = dayRange(today, PLAN_END);
  const plan = {}; days.forEach(d=>plan[d]=[]);
  const placed = new Set(), placedOn = {};
  const byFag = {}; FAG_ORDER.forEach(f=>byFag[f] = items.filter(p=>p.a.fag===f).sort((x,y)=>x.a.order-y.a.order));
  const edf = (x,y)=> (x.a.due<y.a.due?-1:x.a.due>y.a.due?1:0) || (x.a.pri-y.a.pri) || (FAG_ORDER.indexOf(x.a.fag)-FAG_ORDER.indexOf(y.a.fag)) || (x.a.order-y.a.order);
  const eligible = (p,d) => !placed.has(p.a.id) && (!p.a.earliest || p.a.earliest<=d) && d<=lastStudy(p.a.fag);
  for(const d of days){
    const cap = capOf(d, ps); let left = cap - (d===today ? doneToday : 0);
    if(left<=0) continue;
    const put = p => { plan[d].push(p); placed.add(p.a.id); placedOn[p.a.id]=d; left -= p.rem; };
    // 1) det som har frist i dag eller tidligere
    items.filter(p=>eligible(p,d) && p.a.due<=d).sort(edf).forEach(p=>{ if(left>0) put(p); });
    // 2) jevnt tempo per fag fram mot eksamen
    const active = FAG_ORDER.filter(f=>d<=lastStudy(f)).sort((a,b)=>lastStudy(a)<lastStudy(b)?-1:1);
    for(const f of active){
      const rest = byFag[f].filter(p=>!placed.has(p.a.id));
      if(!rest.length) continue;
      const daysLeft = days.filter(x=>x>=d && x<=lastStudy(f) && capOf(x,ps)>0).length || 1;
      const need = rest.reduce((s,p)=>s+p.rem,0)/daysLeft;
      let alloc = 0;
      for(const p of rest.filter(p=>eligible(p,d))){
        if(alloc>=need || left<=0) break;
        if(p.rem > left+20 && !(alloc===0 && plan[d].length===0)) continue;
        put(p); alloc += p.rem;
      }
    }
    // 3) fyll resten av dagen etter nærmeste frist
    for(let g=0; g<40 && left>=15; g++){
      const c = items.filter(p=>eligible(p,d) && p.rem<=left+15).sort(edf)[0];
      if(!c) break; put(c);
    }
  }
  const overflow = items.filter(p=>!placed.has(p.a.id));
  const late = items.filter(p=>placed.has(p.a.id) && placedOn[p.a.id] > p.a.due && p.a.due>=today);
  return {plan, overflow, late, placedOn};
}
function planFor(d){ const P = PLAN_CACHE || buildPlan(); return (P.plan[d]||[]); }
function nextActFor(f){ const P = PLAN_CACHE || buildPlan(); for(const d of Object.keys(P.plan).sort()){ const x = P.plan[d].find(p=>p.a.fag===f); if(x) return {d, p:x}; } return null; }
function fagProgress(f){ const acts = ACTS.filter(a=>a.fag===f); const tot = acts.reduce((s,a)=>s+a.min,0); const done = acts.reduce((s,a)=>{ const st=actStatus(a); return s + a.min*(st.done?1:(st.prog||0)); },0); return {tot, done, pct: tot? done/tot : 0, n:acts.length, ndone:acts.filter(a=>actStatus(a).done).length}; }
function fagMastery(f){ const qs = QF(f); const sc = qs.map(questionScore).filter(x=>x!=null); return {n:qs.length, tried:sc.length, m: sc.length ? sc.reduce((a,b)=>a+b,0)/sc.length : null}; }

async function resetAct(a){
  const del = async (c, id) => { if(STATE[c] && STATE[c][id]) await deleteDoc(c, id); };
  await del('todos', a.id);
  if(a.type==='qs' || a.type==='set') for(const q of qsOfAct(a)) for(const f of q.fields) await del('attempts', fieldKey(q.id, f.i));
  if(a.type==='set') for(const [id, ss] of Object.entries(STATE.sessions)) if(ss.oving===a.set) await del('sessions', id);
  if(a.type==='examscore') await del('exams', 'mek-'+a.set);
  if(a.item && a.type==='oving') for(const {q,f} of fieldsOf(a.item)) await del('attempts', fieldKey(q.id, f.i));
  if(a.item && a.type==='prove') for(const [id, ss] of Object.entries(STATE.sessions)) if(ss.oving===a.item.oving && ss.mode==='prove') await del('sessions', id);
  if(a.item && a.type==='exam'){ const tasks = a.item.set ? EXBY[a.item.set].tasks.map(t=>[a.item.set,t[0]]) : a.item.tasks; for(const [x,n] of tasks) await del('exams', x+'_'+n); }
}
function bindReset(root){
  const bar = root.querySelector('#rbar'); if(!bar) return;
  const boxes = () => [...root.querySelectorAll('input[data-rsel]')];
  const upd = () => { const n = boxes().filter(b=>b.checked).length; bar.hidden = !n; bar.querySelector('.rn').textContent = n; };
  boxes().forEach(b=>b.onchange = upd);
  root.querySelectorAll('[data-selall]').forEach(btn=>btn.onclick = e=>{ e.preventDefault(); const sec = btn.closest('details'); const bs = [...sec.querySelectorAll('input[data-rsel]')]; const on = bs.some(b=>!b.checked); bs.forEach(b=>b.checked = on); upd(); });
  bar.querySelector('.rcancel').onclick = ()=>{ boxes().forEach(b=>b.checked=false); upd(); };
  bar.querySelector('.rgo').onclick = async ()=>{
    const ids = [...new Set(boxes().filter(b=>b.checked).map(b=>b.dataset.rsel))]; if(!ids.length) return;
    if(!confirm(`Nullstille ${ids.length} aktivitet${ids.length>1?'er':''}?\n\nSvarene, forsøkene og avkrysningene som hører til slettes, og aktivitetene legges tilbake i planen. Oppgaver som også inngår i andre aktiviteter nullstilles der også. Dette kan ikke angres.`)) return;
    for(const id of ids){ const a = ACTBY[id]; if(a) await resetAct(a); }
    PLAN_CACHE = null; toast(`${ids.length} nullstilt`); route();
  };
}

// ---------- Pensumdiagram ----------
function topicProgress(qs){
  let m=0, t=0, n=0;
  qs.forEach(q=>q.fields.forEach(f=>{ n++; const a = STATE.attempts[fieldKey(q.id,f.i)]; if(!a||!a.hist||!a.hist.length) return;
    if(a.hist.some(r=>r[1]===1 && !r[4])) m++; else t++; }));
  return {m, t, n};
}
function pensumHtml(f){
  const F = FAG[f]; const qs = QF(f);
  const topics = Object.entries(TOPICS).filter(([k,t])=>(t.fag||'matte')===f).map(([k,t])=>({k, t, p:topicProgress(qs.filter(q=>q.topic===k))})).filter(x=>x.p.n);
  const W = topics.reduce((s,x)=>s+(x.t.vekt||1),0) || 1;
  const tot = topics.reduce((o,x)=>{ const w=(x.t.vekt||1)/W; o.m += w*x.p.m/x.p.n; o.t += w*x.p.t/x.p.n; return o; }, {m:0,t:0});
  const bar = (m, t, big, label) => { const pm = Math.round(m*100), pt = Math.round(t*100), pr = Math.max(0, 100-pm-pt);
    return `<div class="pbar ${big?'big':''}" style="--fc:${F.farge}" title="${esc(label)}: ${pm} % mestret, ${pt} % forsøkt, ${pr} % igjen">
      ${pm?`<i class="pm" style="width:${pm}%"></i>`:''}${pt?`<i class="pt" style="width:${pt}%"></i>`:''}${pr?`<i class="pr" style="width:${pr}%"></i>`:''}</div>`; };
  const pm = Math.round(tot.m*100), pt = Math.round(tot.t*100);
  return `<div class="card pensum" style="--fc:${F.farge}">
    <div class="row between" style="align-items:baseline"><h2 style="margin:0">Pensum</h2>
      <div class="plegend small"><span><i class="pm"></i>Mestret</span><span><i class="pt"></i>Forsøkt</span><span><i class="pr"></i>Igjen</span></div></div>
    <div class="phero"><span class="pnum">${pm} %</span><span class="muted small">mestret · ${pt} % forsøkt · <strong>${100-pm-pt} % igjen</strong></span></div>
    ${bar(tot.m, tot.t, true, 'Hele pensum')}
    <details class="ptopics" ${foldOpen('pt-'+f, false)?'open':''} data-fold="pt-${f}"><summary class="small">Per tema</summary>
    <div class="prows">${topics.map(x=>`<div class="prow"><span class="pl small" title="${esc(x.t.navn)}">${esc(shortTopic(x.t.navn))}</span>${bar(x.p.m/x.p.n, x.p.t/x.p.n, false, x.t.navn)}<span class="pv small muted">${x.p.m}/${x.p.n}</span></div>`).join('')}</div></details>
    <p class="small muted" style="margin:8px 0 0">Vektet etter temaenes andel av pensum. «Mestret» = riktig minst én gang uten at fasit var vist.</p></div>`;
}

    else if(s.field){ used.add(s.field); html += newFieldHtml(q, q.fields.find(f=>f.i===s.field), mode); }
  });
  q.fields.filter(f=>!used.has(f.i)).forEach(f=>{ html += newFieldHtml(q, f, mode); });
  return html;
}
function mdBlock(t){ return esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').split(/\n{2,}/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join(''); }
function newFieldHtml(q, f, mode){
  if(!f) return '';
  const id = `fld_${q.id}_${f.i}`, multi = q.fields.length>1;
  const tag = multi ? `<span class="tag">${f.i}</span>` : '';
  const chk = mode==='ov' ? `<button class="btn small chk" data-q="${q.id}" data-i="${f.i}">Sjekk</button>` : '';
  if(f.kind==='expr' && f.tex){
    const u = f.unitTex ? (/\\/.test(f.unitTex) ? `$${f.unitTex}$` : esc(f.unitTex)) : '';
    return `<div class="fblock"><span class="fld exf" data-q="${q.id}" data-i="${f.i}"><span class="flab">$${f.tex} =$</span><input type="text" id="${id}" autocomplete="off" spellcheck="false" inputmode="decimal"><span class="funit">${u}</span>${chk}<span class="st"></span></span>${f.desc?`<div class="fdesc">${esc(f.desc)}</div>`:''}</div>`;
  }
  if(f.kind==='expr'){
    const lab = f.img ? `<div class="segimg fieldimg">${zimg(f.img,'Svarfelt '+f.i)}</div>` : '';
    return `<div class="fblock">${lab}<span class="fld" data-q="${q.id}" data-i="${f.i}">${tag}${f.label?`<span class="flab">${mdInline(f.label)} =</span>`:f.img?'<span class="flab small muted">Svar:</span>':''}<input type="text" id="${id}" autocomplete="off" spellcheck="false" inputmode="decimal">${f.unit?`<span class="small">${esc(f.unit)}</span>`:''}${chk}<span class="st"></span></span></div>`;
  }
  if(f.kind==='pick' || f.kind==='mc'){
    const labels = f.kind==='mc' ? f.opts : (f.labels||[]);
    const textOnly = f.kind==='mc' || (labels.length && labels.every(l=>l && l.trim()));
    const opts = (f.kind==='mc'?f.opts:f.opts).map((o,k)=>{ const lab = labels[k];
      return `<label class="opt ${f.orient==='h'?'h':''}"><input type="radio" name="${id}" value="${k}"><span class="ol">${textOnly? mdInline(lab) : zimg(o, lab||('Alternativ '+(k+1)), 'optimg')}</span></label>`; }).join('');
    return `<div class="fblock"><span class="fld pick" data-q="${q.id}" data-i="${f.i}" style="display:block">${multi?`<div>${tag}</div>`:''}<div class="opts ${f.orient==='h'?'h':''}">${opts}</div><div class="row" style="margin-top:6px">${chk}<span class="st"></span></div><div class="mcfb" hidden></div></span></div>`;
  }
  if(f.kind==='card'){
    return `<div class="fblock"><span class="fld cardf" data-q="${q.id}" data-i="${f.i}" style="display:block"><div class="cardback" hidden><div class="k">Baksiden</div>${mdBlock(f.ans)}</div>
      <div class="row" style="margin-top:6px">${mode==='ov'?`<button class="btn small flip">Snu kortet</button><button class="btn small sec c-ok" hidden>Kunne det</button><button class="btn small sec c-bad" hidden>Kunne det ikke</button>`:''}<span class="st"></span></div></span></div>`;
  }
  // self / text
  return `<div class="fblock"><span class="fld selff" data-q="${q.id}" data-i="${f.i}" style="display:block">${tag}<textarea class="ans" id="${id}" placeholder="${f.kind==='text'?'Skriv svaret ditt her før du sammenligner med modellsvaret.':'Skriv svaret eller sluttsvaret ditt her (håndberegningen gjør du på papir).'}"></textarea><span class="st muted small"></span></span></div>`;
}
function readField(wrap, f){
  const r = wrap.querySelector('input[type=radio]:checked'); if(r) return +r.value;
  const inp = wrap.querySelector('input[type=text],select,textarea'); return inp ? inp.value : '';
}
function gradeField(f, val){
  if(f.kind==='pick' || f.kind==='mc'){ if(val===''||val==null) return {ok:false, reason:'velg et alternativ'}; return {ok: val===f.ans || (f.alt||[]).includes(val)}; }
  if(f.kind==='choice') return {ok: val===f.ans};
  return checkExpr(val, f.ans, f.tol);
}
function optHtml(f, k){ if(k==null) return '–'; if(f.kind==='mc') return mdInline(f.opts[k]); const lab = (f.labels||[])[k]; return (lab? mdInline(lab)+' ' : '') + (f.opts&&f.opts[k]? zimg(f.opts[k], lab||'Alternativ', 'optimg') : ''); }
function newAnsHtml(f){
  if(f.kind==='pick' || f.kind==='mc') return optHtml(f, f.ans) + ((f.alt||[]).filter(x=>x!==f.ans).length ? `<div class="small">Godtas også: ${(f.alt||[]).filter(x=>x!==f.ans).map(x=>optHtml(f,x)).join(' ')}</div>` : '');
  if(f.kind==='expr' && f.tex) return `$${f.tex} = ${String(f.ans).replace('.',',')}\\ ${f.unitTex? (/\\/.test(f.unitTex)? f.unitTex : '\\text{'+f.unitTex+'}') : ''}$${f.tol?` <span class="small muted">(godtas ± ${String(f.tol).replace('.',',')})</span>`:''}`;
  if(f.kind==='expr') return `<code>${esc(f.ans)}</code>${f.unit?' '+esc(f.unit):''}${f.tol?` <span class="small muted">(godtas ± ${String(f.tol).replace('.',',')})</span>`:''}`;
  if(f.kind==='card') return mdBlock(f.ans);
  return f.ref ? mdBlock(f.ref) : '<span class="muted">Se løsningsforslaget under.</span>';
}
function newFasitHtml(q, f){
  let h = '';
  if(q.note) h += `<p class="warnnote" style="margin:0 0 10px">${mdInline(q.note)}</p>`;
  if(q.lf){
    h += `<h4>Offisielt løsningsforslag</h4><p class="small" style="margin:0 0 6px"><a href="${q.lf.pdf}#page=${q.lf.pages[0]}" target="_blank" rel="noopener">${esc(q.lf.doc)}, s. ${q.lf.pages.join(', ')}</a> · ${esc(q.lf.oppg)}${q.src?`, del ${esc(q.src.oppg)}`:''}. Forklaringen følger fremgangsmåten der.</p>`;
    h += `<p class="rightanswer">Fasit${q.fields.length>1?' – felt '+f.i:''}: ${newAnsHtml(f)}</p>`;
    if(q.fields.length>1) h += `<details style="margin:0 0 10px"><summary class="small" style="cursor:pointer">Fasit for alle felt i deloppgaven</summary><div class="stack" style="gap:4px;margin-top:6px">${q.fields.map(x=>`<div><span class="small">Felt ${x.i}:</span> ${newAnsHtml(x)}</div>`).join('')}</div></details>`;
    if(q.explain) h += `<p style="margin:0 0 8px"><strong>Kort oppsummert:</strong> ${mdInline(q.explain)}</p>`;
    h += `<details class="lfpages" open><summary class="small" style="cursor:pointer">Vis løsningsforslaget (${q.lf.pages.length} side${q.lf.pages.length>1?'r':''})</summary>${q.lf.imgs.map((s,k)=>`<div class="lfimg"><div class="small muted">${esc(q.lf.doc)} s. ${q.lf.pages[k]}</div>${zimg(s,'Løsningsforslag side '+q.lf.pages[k])}</div>`).join('')}</details>`;
    if(q.steg && q.steg.length) h += `<h4 style="margin-top:12px">Supplerende forklaring <span class="pill mute">egne mellomregninger</span></h4>${stepsHtml(q)}`;
  } else {
    h += `<p class="small" style="margin:0 0 8px"><span class="pill mute">Fasit mangler i kursmaterialet</span> Dette er et egenlaget spørsmål. Svaret bygger på <a href="${q.src.pdf}" target="_blank" rel="noopener">${esc(q.src.doc)}, ${esc(q.src.label)}</a>.</p>`;
    h += `<h4>${f.kind==='text'?'Modellsvar':f.kind==='card'?'Baksiden':'Riktig svar'}</h4><div class="rightanswer">${newAnsHtml(f)}</div>`;
    if(f.kind==='mc' && f.why) h += `<h4 style="margin-top:10px">Hvorfor de andre alternativene er feil</h4><ul class="plain small">${f.opts.map((o,k)=>k===f.ans?'':`<li><strong>${mdInline(o)}:</strong> ${mdInline(f.why[k])}</li>`).join('')}</ul>`;
    if(q.explain) h += `<p style="margin:8px 0 0">${mdInline(q.explain)}</p>`;
  }
  return h;
}
function newKildeHtml(q){
  const t = TOPICS[q.topic] || {};
  let h = `<h4>Kilde</h4><p class="small" style="margin:0 0 6px">${q.egen?`<a href="${q.src.pdf}" target="_blank" rel="noopener">${esc(q.src.doc)}, ${esc(q.src.label)}</a>`:`Oppgaven: <a href="${q.src.pdf}#page=${q.src.page}" target="_blank" rel="noopener">${esc(q.src.doc)} s. ${q.src.page}</a>`}</p>`;
  if(t.lysark && t.lysark.length) h += `<p class="small" style="margin:0 0 6px">Forelesning (${esc(t.navn)}): ${t.lysark.map(l=>`<a href="${l.pdf}" target="_blank" rel="noopener">${esc(l.t)}</a>`).join(' · ')}</p>`;
  if(t.samling && t.samling.length){ const so = BM.res.samling_oppg||{}, sl = BM.res.samling_los||{}; h += `<p class="small" style="margin:0 0 6px">Oppgavesamlingen: oppgave ${t.samling.slice(0,6).map(n=>`<a href="mek/pdf/oppgavesamling.pdf#page=${so[n]||1}" target="_blank" rel="noopener">${n}</a> (<a href="mek/pdf/oppgavesamling.pdf#page=${sl[n]||1}" target="_blank" rel="noopener">løsning</a>)`).join(', ')}${t.samling.length>6?' …':''}</p>`; }
  if(fagOf(q)==='mek') h += `<p class="small" style="margin:0"><a href="${BM.res.formelark}" target="_blank" rel="noopener">Formelarket</a> (bjelkeformlene står på side A3–A4).</p>`;
  if(q.egen && q.segs && q.segs.length) h += q.segs.map(s=>zimg(s.img,'Figur fra kilden')).join('');
  return h;
}
// Forstørring av bilder
function lightbox(src, alt){
  const ov = document.createElement('div'); ov.className = 'lb'; let z = 1;
  ov.innerHTML = `<div class="lb-bar"><span class="small">${esc(alt||'')}</span><span class="row" style="gap:6px"><button class="btn small" data-z="-1">−</button><button class="btn small" data-z="0">100 %</button><button class="btn small" data-z="1">+</button><a class="btn small" href="${esc(src)}" target="_blank" rel="noopener">Åpne bildet</a><button class="btn small primary lb-x">Lukk (Esc)</button></span></div><div class="lb-body"><img src="${esc(src)}" alt="${esc(alt||'')}"></div>`;
  document.body.appendChild(ov); const img = ov.querySelector('img');
  const fit = () => { img.style.width = ''; img.style.maxWidth = 'none'; img.style.width = Math.round(img.naturalWidth * z) + 'px'; };
  img.onload = () => { z = Math.min(1.6, Math.max(1, (window.innerWidth-40)/img.naturalWidth)); fit(); };
  ov.querySelectorAll('[data-z]').forEach(b=>b.onclick=()=>{ const v=+b.dataset.z; z = v===0 ? 1 : Math.max(0.3, Math.min(4, z*(v>0?1.25:0.8))); fit(); });
  const close = () => { ov.remove(); document.removeEventListener('keydown', key); };
  const key = e => { if(e.key==='Escape') close(); };
  document.addEventListener('keydown', key);
  ov.querySelector('.lb-x').onclick = close; ov.onclick = e => { if(e.target===ov || e.target.classList.contains('lb-body')) close(); };
}
document.addEventListener('click', e=>{ const im = e.target.closest('img.zoom'); if(!im || im.closest('.lb')) return; if(im.closest('label.opt')) return; e.preventDefault(); lightbox(im.getAttribute('src'), im.alt); });
document.addEventListener('dblclick', e=>{ const im = e.target.closest('label.opt img.zoom'); if(im) lightbox(im.getAttribute('src'), im.alt); });
